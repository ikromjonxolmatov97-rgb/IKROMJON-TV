<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV — Custom & Editable App</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --card-bg: #151a23;
            --card-hover: #1e2532;
            --accent-color: #2563eb;
            --accent-light: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ef4444;
        }

        body.light-theme {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --card-hover: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 70px;
            min-height: 100vh;
        }

        /* Header Bar */
        .app-header {
            position: sticky;
            top: 0; z-index: 100;
            background: rgba(11, 14, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .brand-logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 18px; font-weight: 800; color: var(--text-primary);
        }

        .brand-logo span {
            background: var(--accent-color);
            padding: 2px 6px; border-radius: 6px; font-size: 11px; color: #fff;
        }

        .digital-clock {
            font-family: monospace;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 700; color: var(--accent-light);
        }

        .lang-select {
            background: var(--card-bg); color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; outline: none;
        }

        /* Hero Carousel */
        .hero-section { padding: 12px 16px; }

        .hero-carousel {
            display: flex; gap: 12px; overflow-x: auto;
            scroll-snap-type: x mandatory; scrollbar-width: none;
        }
        .hero-carousel::-webkit-scrollbar { display: none; }

        .hero-card {
            min-width: 88%; scroll-snap-align: center;
            height: 170px; border-radius: 14px; padding: 16px;
            display: flex; flex-direction: column; justify-content: flex-end;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            background-size: cover; background-position: center;
            position: relative; flex-shrink: 0;
        }

        .hero-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(11,14,20,0.9) 100%);
            border-radius: 14px;
        }

        .hero-content { position: relative; z-index: 2; }
        .hero-tag {
            background: var(--accent-color); color: #fff;
            font-size: 9px; font-weight: 800; padding: 2px 6px;
            border-radius: 4px; width: max-content; margin-bottom: 4px;
        }
        .hero-title { font-size: 16px; font-weight: 800; color: #fff; }
        
        .card-actions {
            display: flex; gap: 8px; margin-top: 6px;
        }

        .play-btn {
            background: #ffffff; color: #000; border: none;
            padding: 6px 12px; border-radius: 6px; font-weight: 700;
            font-size: 11px; cursor: pointer;
        }

        .delete-btn {
            background: var(--danger-color); color: #fff; border: none;
            padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
        }

        .section-header {
            padding: 10px 16px 6px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .section-title { font-size: 14px; font-weight: 700; }

        .horizontal-grid {
            display: flex; gap: 10px; padding: 0 16px 14px 16px;
            overflow-x: auto; scrollbar-width: none;
        }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        .channel-card {
            min-width: 110px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 8px; display: flex; flex-direction: column; align-items: center;
            text-align: center; cursor: pointer; position: relative;
        }

        .channel-img-wrapper {
            width: 60px; height: 45px; border-radius: 6px;
            background: rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
            margin-bottom: 6px; padding: 2px;
        }
        .channel-img { width: 100%; height: 100%; object-fit: contain; }
        .channel-name { font-size: 11px; font-weight: 600; }
        .channel-epg { font-size: 8px; color: var(--text-secondary); margin-top: 2px; }

        .movies-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; padding: 0 16px 20px 16px;
        }

        .movie-card {
            background: var(--card-bg); border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color); cursor: pointer; position: relative;
        }
        .movie-poster { width: 100%; height: 120px; object-fit: cover; }
        .movie-info { padding: 6px; }
        .movie-title { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mini-del-btn {
            position: absolute; top: 4px; right: 4px;
            background: rgba(239, 68, 68, 0.85); color: #fff; border: none;
            width: 20px; height: 20px; border-radius: 50%;
            font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 55px;
            background: rgba(15, 20, 28, 0.95); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: grid; grid-template-columns: repeat(5, 1fr);
            align-items: center; z-index: 200;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            color: var(--text-secondary); font-size: 9px; font-weight: 600; cursor: pointer;
        }
        .nav-item.active { color: var(--accent-color); }
        .nav-icon { font-size: 16px; }

        /* Modals & Editors */
        .settings-modal {
            position: fixed; inset: 0; background: var(--bg-main);
            z-index: 900; display: none; flex-direction: column; overflow-y: auto;
            padding: 20px 16px 80px 16px;
        }
        .settings-modal.active { display: flex; }

        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }

        .input-form {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 14px; margin-bottom: 16px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .input-form label { font-size: 11px; font-weight: 700; color: var(--text-secondary); }

        .input-form input, .input-form select {
            background: var(--bg-main); color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 8px 10px;
            border-radius: 6px; font-size: 12px; outline: none;
        }

        .btn-submit {
            background: var(--accent-color); color: #fff; border: none;
            padding: 10px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer;
        }

        /* Player Modal */
        .modal-player {
            position: fixed; inset: 0; background: #000;
            z-index: 1000; display: none; flex-direction: column;
        }
        .modal-player.active { display: flex; }
        .player-bar {
            padding: 10px 16px; background: rgba(15, 20, 28, 0.9);
            display: flex; justify-content: space-between; align-items: center; color: #fff;
        }
        .player-viewport { flex: 1; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 85vh; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="brand-logo">IKROMJON <span>TV</span></div>
        <div class="digital-clock" id="liveClock">00:00:00</div>
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="uz">UZ</option>
            <option value="ru">RU</option>
            <option value="en">ENG</option>
        </select>
    </header>

    <!-- Asosiy Ekran -->
    <main id="mainView">
        <div class="section-header">
            <div class="section-title" id="txtPremyeraHeader">🔥 Yangi Premyeralar 2026</div>
        </div>
        <section class="hero-section">
            <div class="hero-carousel" id="premyeraCarousel"></div>
        </section>

        <div class="section-header">
            <div class="section-title" id="txtTvHeader">📡 Jonli Telekanallar (Live)</div>
        </div>
        <div class="horizontal-grid" id="channelsRow"></div>

        <div class="section-header">
            <div class="section-title" id="txtMovieHeader">🎬 Kinolar va Seriallar</div>
        </div>
        <div class="movies-grid" id="moviesGrid"></div>
    </main>

    <!-- ✏️ KONTENT QO'SHISH MODALI (ADMIN) -->
    <div class="settings-modal" id="addContentView">
        <div class="modal-header">
            <h2>➕ Yangi Kontent Qo'shish</h2>
            <button onclick="switchTab('main')" style="background:none; border:none; color:var(--text-primary); font-size:22px;">✕</button>
        </div>

        <form class="input-form" onsubmit="handleAddNewContent(event)">
            <div>
                <label>Bo'limni tanlang:</label>
                <select id="newType" required>
                    <option value="premieres">🔥 Premyera</option>
                    <option value="tvChannels">📡 Telekanal</option>
                    <option value="movies">🎬 Kino / Serial</option>
                </select>
            </div>

            <div>
                <label>Nomi / Sarlavha:</label>
                <input type="text" id="newTitle" placeholder="Masalan: Yangi Kino 2026" required>
            </div>

            <div>
                <label>Rasm / Poster Havolasi (URL):</label>
                <input type="url" id="newImg" placeholder="https://site.com/rasm.jpg" required>
            </div>

            <div>
                <label>Video / Stream Havolasi (.m3u8 yoki .mp4):</label>
                <input type="url" id="newStream" placeholder="https://site.com/video.m3u8" required>
            </div>

            <div>
                <label>Tavsif / EPG (Ixtiyoriy):</label>
                <input type="text" id="newEpg" placeholder="Masalan: HD Sifatda">
            </div>

            <button type="submit" class="btn-submit">💾 Ro'yxatga Qo'shish</button>
        </form>
    </div>

    <!-- ⚙️ SOZLAMALAR MODALI -->
    <div class="settings-modal" id="settingsView">
        <div class="modal-header">
            <h2>⚙️ Sozlamalar va Boshqaruv</h2>
            <button onclick="switchTab('main')" style="background:none; border:none; color:var(--text-primary); font-size:22px;">✕</button>
        </div>

        <div class="input-form">
            <label>Tizim xotirasini boshqarish:</label>
            <button onclick="resetToDefaultData()" class="btn-submit" style="background:var(--danger-color);">🔄 Kontentni Boshlang'ich Holatga Tiklash</button>
        </div>
    </div>

    <!-- Fullscreen Video Player -->
    <div class="modal-player" id="modalPlayer">
        <div class="player-bar">
            <span id="playerTitle" style="font-size:12px; font-weight:700;">Stream...</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
        </div>
        <div class="player-viewport">
            <video id="activeVideo" controls playsinline></video>
        </div>
    </div>

    <!-- Bottom Nav Bar -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('main')"><span class="nav-icon">🏠</span><span id="navHome">Asosiy</span></div>
        <div class="nav-item" onclick="switchTab('main')"><span class="nav-icon">📺</span><span id="navTv">Kanallar</span></div>
        <div class="nav-item" onclick="switchTab('add')"><span class="nav-icon">➕</span><span>Qo'shish</span></div>
        <div class="nav-item" onclick="openSearch()"><span class="nav-icon">🔍</span><span id="navSearch">Qidiruv</span></div>
        <div class="nav-item" onclick="switchTab('settings')"><span class="nav-icon">⚙️</span><span id="navProfile">Kabinet</span></div>
    </nav>

    <script>
        // Boshlang'ich default ma'lumotlar
        const defaultData = {
            premieres: [
                { id: 1, title: "Koinot Subhi: 2026", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800", stream: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
                { id: 2, title: "Afsona: Qaytish", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800", stream: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
            ],
            tvChannels: [
                { id: 1, name: "Euronews Live", logo: "https://upload.wikimedia.org/wikipedia/commons/2/29/Euronews_logo.svg", epg: "Dunyo yangiliklari", stream: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
                { id: 2, name: "NASA TV", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg", epg: "Koinot efiri", stream: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8" }
            ],
            movies: [
                { id: 1, title: "Sintez 2026", img: "https://picsum.photos/200/300?random=1", stream: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
                { id: 2, title: "Sehrli Olam", img: "https://picsum.photos/200/300?random=2", stream: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4" }
            ]
        };

        // LocalStorage dan ma'lumotlarni yuklash
        let appData = JSON.parse(localStorage.getItem('ikromjon_tv_data')) || defaultData;

        function saveData() {
            localStorage.setItem('ikromjon_tv_data', JSON.stringify(appData));
            renderAllContent();
        }

        // Kontentni ekranga chiqarish
        function renderAllContent() {
            // 1. Premyeralar
            const premyeraCarousel = document.getElementById('premyeraCarousel');
            premyeraCarousel.innerHTML = '';
            appData.premieres.forEach(p => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                card.style.backgroundImage = `url('${p.img}')`;
                card.innerHTML = `
                    <div class="hero-content">
                        <div class="hero-tag">PREMYERA</div>
                        <div class="hero-title">${p.title}</div>
                        <div class="card-actions">
                            <button class="play-btn" onclick="playStream('${p.title}', '${p.stream}')">▶ Tomosha qilish</button>
                            <button class="delete-btn" onclick="deleteItem('premieres', ${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
                premyeraCarousel.appendChild(card);
            });

            // 2. Telekanallar
            const channelsRow = document.getElementById('channelsRow');
            channelsRow.innerHTML = '';
            appData.tvChannels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <button class="mini-del-btn" onclick="event.stopPropagation(); deleteItem('tvChannels', ${ch.id})">✕</button>
                    <div class="channel-img-wrapper" onclick="playStream('${ch.name}', '${ch.stream}')"><img src="${ch.logo}" class="channel-img"></div>
                    <div class="channel-name">${ch.name}</div>
                    <div class="channel-epg">${ch.epg || ''}</div>
                `;
                channelsRow.appendChild(card);
            });

            // 3. Kinolar
            const moviesGrid = document.getElementById('moviesGrid');
            moviesGrid.innerHTML = '';
            appData.movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <button class="mini-del-btn" onclick="event.stopPropagation(); deleteItem('movies', ${m.id})">✕</button>
                    <div onclick="playStream('${m.title}', '${m.stream}')">
                        <img src="${m.img}" class="movie-poster">
                        <div class="movie-info"><div class="movie-title">${m.title}</div></div>
                    </div>
                `;
                moviesGrid.appendChild(card);
            });
        }

        // Yangi kontent qo'shish
        function handleAddNewContent(e) {
            e.preventDefault();
            const type = document.getElementById('newType').value;
            const title = document.getElementById('newTitle').value;
            const img = document.getElementById('newImg').value;
            const stream = document.getElementById('newStream').value;
            const epg = document.getElementById('newEpg').value;

            const newItem = {
                id: Date.now(),
                title: title,
                name: title,
                img: img,
                logo: img,
                stream: stream,
                epg: epg
            };

            appData[type].push(newItem);
            saveData();
            
            alert("Muvaffaqiyatli qo'shildi!");
            e.target.reset();
            switchTab('main');
        }

        // Kontentni o'chirish
        function deleteItem(type, id) {
            if (confirm("Ushbu kontentni o'chirishga ishonchingiz komilmi?")) {
                appData[type] = appData[type].filter(item => item.id !== id);
                saveData();
            }
        }

        // Zavod holatiga tiklash
        function resetToDefaultData() {
            if (confirm("Barcha saqlangan kontentlar o'chib ketadi va boshlang'ich holatga qaytadi. Rozimisiz?")) {
                appData = defaultData;
                saveData();
                alert("Kontent tiklandi!");
            }
        }

        // Pleyer
        let hlsInstance = null;
        function playStream(title, url) {
            document.getElementById('playerTitle').innerText = "IKROMJON TV — " + title;
            const video = document.getElementById('activeVideo');
            document.getElementById('modalPlayer').classList.add('active');

            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (hlsInstance) hlsInstance.destroy();
                    hlsInstance = new Hls({ maxBufferLength: 10, enableWorker: true });
                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url; video.play();
                }
            } else {
                if (hlsInstance) hlsInstance.destroy();
                video.src = url; video.play();
            }
        }

        function closePlayer() {
            const video = document.getElementById('activeVideo');
            video.pause(); video.src = "";
            if (hlsInstance) hlsInstance.destroy();
            document.getElementById('modalPlayer').classList.remove('active');
        }

        // Tablar bo'ylab o'tish
        function switchTab(tab) {
            document.getElementById('addContentView').classList.remove('active');
            document.getElementById('settingsView').classList.remove('active');

            if (tab === 'add') document.getElementById('addContentView').classList.add('active');
            if (tab === 'settings') document.getElementById('settingsView').classList.add('active');
        }

        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('uz-UZ');
        }, 1000);

        function openSearch() {
            const q = prompt("Qidirilayotgan kino yoki kanal nomi:");
            if(q) alert("'" + q + "' bo'yicha izlanmoqda...");
        }

        // Dastlabki yuklash
        renderAllContent();
    </script>
</body>
</html>
