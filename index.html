<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKROMJON TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        header h1 {
            font-size: 22px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .player-container {
            width: 100%;
            background-color: #000;
            aspect-ratio: 16 / 9;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .content {
            padding: 15px;
            flex: 1;
        }
        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #a0a0a0;
            text-transform: uppercase;
            font-weight: 600;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .channel-card {
            background-color: #1a1a24;
            padding: 15px 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #2d2d3a;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .channel-card:active {
            transform: scale(0.96);
            background-color: #6A1B9A;
            border-color: #ab47bc;
        }
        .channel-card h3 {
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 IKROMJON TV</h1>
    </header>

    <!-- Video Player -->
    <div class="player-container">
        <iframe id="main-player" src="https://www.youtube.com/embed/21X5lGlDOfg" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- Kanallar va Bo'limlar -->
    <div class="content">
        <div class="section-title">Televideniye va Efirlar</div>
        <div class="channel-grid">
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/21X5lGlDOfg')">
                <h3>🎬 Kinolar</h3>
            </div>
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/live_stream?channel=UC4R8DWoMoI7CAwX8_LjQHig')">
                <h3>🌍 Dunyo Bo'ylab</h3>
            </div>
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/5qap5aO4i9A')">
                <h3>🎶 Musiqa Top 10</h3>
            </div>
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/jfKfPfyJRdk')">
                <h3>☕ Relax / Lofi 24/7</h3>
            </div>
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/2g81116hA68')">
                <h3>⚽ Sport Lahzalari</h3>
            </div>
            <div class="channel-card" onclick="changeVideo('https://www.youtube.com/embed/LIVE_STREAM_ID')">
                <h3>📰 Yangiliklar</h3>
            </div>
        </div>
    </div>

    <script>
        function changeVideo(url) {
            document.getElementById('main-player').src = url;
        }
    </script>

</body>
</html>
