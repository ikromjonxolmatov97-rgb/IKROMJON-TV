<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV — Gallery Upload & Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(18, 26, 43, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --accent-glow: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --border-glow: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 110px; min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER */
        .app-header {
            position: sticky; top: 0; z-index: 100; background: var(--bg-card);
            backdrop-filter: blur(25px); border-bottom: 1px solid var(--border-glow);
            padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
        }

        .brand-logo { font-size: 20px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
        .brand-logo span { background: var(--accent-gradient); padding: 3px 8px; border-radius: 8px; font-size: 10px; }

        /* UPLOAD & EDIT SECTION */
        .action-box {
            background: var(--bg-card); border: 1px dashed var(--accent-glow);
            border-radius: 20px; padding: 16px; margin: 16px 20px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .btn-action {
            background: var(--accent-gradient); color: #fff; border: none;
            padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px;
        }

        /* CARDS & GRID */
        .section-header { padding: 10px 20px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; }
        .horizontal-grid { display: flex; gap: 14px; padding: 0 20px 10px 20px; overflow-x: auto; scrollbar-width: none; }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        .media-card {
            background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px;
            position: relative; flex-shrink: 0; overflow: hidden; width: 140px; transition: all 0.3s;
        }

        .media-thumb { width: 100%; height: 120px; object-fit: cover; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .media-info { padding: 8px; }
        .media-title { font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }

        .card-actions { display: flex; gap: 4px; }
        .btn-card { flex: 1; padding: 5px; border-radius: 8px; border: none; font-size: 10px; font-weight: 700; cursor: pointer; }
        .btn-edit { background: rgba(0, 198, 255, 0.2); color: var(--accent-glow); border: 1px solid var(--accent-glow); }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        /* MODAL EDIT */
        .modal-edit {
            position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-edit.active { display: flex; }
        .edit-box { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 24px; width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .edit-box input { background: var(--bg-glass); border: 1px solid var(--border-glow); padding: 12px; border-radius: 12px; color: #fff; outline: none; }

        /* PLAYER MODAL */
        .modal-player { position: fixed; inset: 0; z-index: 3000; background: #000; display: none; flex-direction: column; }
        .modal-player.active { display: flex; }
        .player-header { padding: 16px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; color: #fff; }
        .player-video { width: 100%; height: 100%; object-fit: contain; flex: 1; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-logo">IKROMJON <span>CINEMA</span></div>
    </header>

    <!-- GALEREYADAN YUKLASH BO'LIMI -->
    <div class="action-box">
        <div style="font-weight: 800; font-size: 13px;">📁 Galereyadan Video yoki Media Yuklash</div>
        <input type="file" id="galleryInput" accept="video/*,image/*" style="display: none;" onchange="handleFileUpload(event)">
        <button class="btn-action" onclick="document.getElementById('galleryInput').click()">
            📤 Galereyadan fayl tanlash
        </button>
    </div>

    <!-- MEDIALAR RO'YXATI -->
    <div class="section-header">
        <span>🎬 Mening Videolarim & TV</span>
    </div>
    <div class="horizontal-grid" id="mediaContainer"></div>

    <!-- TAHRIRLASH MODALI (EDIT MODAL) -->
    <div class="modal-edit" id="editModal">
        <div class="edit-box">
            <h3 style="font-size: 16px;">✏️ Kartochkani Tahrirlash</h3>
            <input type="text" id="editTitleInput" placeholder="Sarlavha (Nomi)">
            <input type="text" id="editStreamInput" placeholder="Video havolasi (URL)">
            <button class="btn-action" onclick="saveMediaChanges()">💾 Saqlash</button>
            <button class="btn-action" style="background: rgba(255,255,255,0.1);" onclick="closeEditModal()">Yopish</button>
        </div>
    </div>

    <!-- PLEYER MODAL -->
    <div class="modal-player" id="modalPlayer">
        <div class="player-header">
            <span id="playerTitle" style="font-weight:800;">...</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <video id="activeVideo" class="player-video" playsinline controls></video>
    </div>

    <script>
        let mediaData = [
            { id: 1, title: "O'zbekiston HD", stream: "https://live.mtrk.uz/hls/uzbekistan/index.m3u8", type: "online" },
            { id: 2, title: "Namuna Video", stream: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", type: "online" }
        ];

        let currentEditId = null;

        // CARDLASH VA CHIZISH
        function renderCards() {
            const container = document.getElementById('mediaContainer');
            container.innerHTML = '';

            mediaData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <div class="media-thumb" onclick="playMedia('${item.id}')">🎬</div>
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="card-actions">
                            <button class="btn-card btn-edit" onclick="openEditModal(${item.id})">✏️ Edit</button>
                            <button class="btn-card btn-del" onclick="deleteMedia(${item.id})">🗑️</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // GALEREYADAN YUKLASH ENGINE
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileURL = URL.createObjectURL(file);
            const newMedia = {
                id: Date.now(),
                title: file.name.replace(/\.[^/.]+$/, ""), // Fayl nomini olish
                stream: fileURL,
                type: "local"
            };

            mediaData.unshift(newMedia);
            renderCards();
            alert("Video galereyadan muvaffaqiyatli qo'shildi!");
        }

        // TAHRIRLASH (EDIT) ENGINE
        function openEditModal(id) {
            currentEditId = id;
            const item = mediaData.find(m => m.id === id);
            if (item) {
                document.getElementById('editTitleInput').value = item.title;
                document.getElementById('editStreamInput').value = item.stream;
                document.getElementById('editModal').classList.add('active');
            }
        }

        function saveMediaChanges() {
            const newTitle = document.getElementById('editTitleInput').value;
            const newStream = document.getElementById('editStreamInput').value;

            const item = mediaData.find(m => m.id === currentEditId);
            if (item) {
                item.title = newTitle;
                item.stream = newStream;
                renderCards();
                closeEditModal();
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            currentEditId = null;
        }

        function deleteMedia(id) {
            if (confirm("Rostdan ham ushbu videoni o'chirmoqchimisiz?")) {
                mediaData = mediaData.filter(m => m.id !== id);
                renderCards();
            }
        }

        // PLEYER
        let hls = null;
        const video = document.getElementById('activeVideo');

        function playMedia(id) {
            const item = mediaData.find(m => m.id == id);
            if (!item) return;

            document.getElementById('playerTitle').innerText = item.title;
            document.getElementById('modalPlayer').classList.add('active');

            if (hls) hls.destroy();

            if (item.stream.includes('.m3u8') && Hls.isSupported()) {
                hls = new Hls(); hls.loadSource(item.stream); hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = item.stream;
                video.play();
            }
        }

        function closePlayer() {
            video.pause(); video.src = "";
            if (hls) { hls.destroy(); hls = null; }
            document.getElementById('modalPlayer').classList.remove('active');
        }

        // DASTURGA TUSHGANDA CHIZISH
        renderCards();
    </script>
</body>
</html>
