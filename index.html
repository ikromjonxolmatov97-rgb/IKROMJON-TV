<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV — TV & Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --card-bg: #151a23;
            --card-hover: #1e2532;
            --accent-blue: #2563eb;
            --accent-light: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 70px;
            min-height: 100vh;
        }

        /* Top Header Navigation & Clock Bar */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .brand-logo span {
            background: linear-gradient(135deg, var(--accent-light), var(--accent-blue));
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            color: #fff;
        }

        /* Clock Display Widget */
        .digital-clock {
            font-family: monospace;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-light);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Language Switcher Dropdown */
        .lang-select {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        /* Hero Banner Slider */
        .hero-section {
            padding: 14px 16px;
        }

        .hero-banner {
            width: 100%;
            height: 170px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(11,14,20,0.95) 100%), 
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80') center/cover;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .hero-tag {
            background: var(--accent-blue);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            width: max-content;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .play-now-btn {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: max-content;
            cursor: pointer;
            margin-top: 6px;
        }

        /* Section Title */
        .section-header {
            padding: 0 16px 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
        }

        /* Channel Row Carousel */
        .horizontal-grid {
            display: flex;
            gap: 12px;
            padding: 0 16px 20px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        /* Channel Card with Images */
        .channel-card {
            min-width: 120px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .channel-img-wrapper {
            width: 70px;
            height: 50px;
            border-radius: 8px;
            background: #1e2532;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .channel-epg {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        /* Movie Cards Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 16px 20px 16px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .movie-poster {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .movie-info {
            padding: 6px;
        }

        .movie-title {
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 55px;
            background: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-secondary);
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-light); }
        .nav-icon { font-size: 16px; }

        /* Video Player Modal */
        .modal-player {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .modal-player.active { display: flex; }

        .player-bar {
            padding: 12px 16px;
            background: rgba(15, 20, 28, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        .player-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video { width: 100%; max-height: 80vh; }
    </style>
</head>
<body>

    <!-- Header Navigation & Language Switcher -->
    <header class="app-header">
        <div class="brand-logo">
            IKROMJON <span>TV</span>
        </div>

        <!-- Live Clock Display -->
        <div class="digital-clock" id="liveClock">00:00:00</div>

        <div class="header-actions">
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="uz">UZ</option>
                <option value="ru">RU</option>
                <option value="en">ENG</option>
                <option value="tj">TJ</option>
                <option value="kz">KZ</option>
            </select>
        </div>
    </header>

    <!-- Main Hero Banner -->
    <section class="hero-section">
        <div class="hero-banner">
            <div class="hero-tag" id="txtPremyera">PREMYERA</div>
            <div class="hero-title">Katta Eksklyuziv Kinolar</div>
            <button class="play-now-btn" onclick="openPlayer('Toshkent Kinofestivali 2026', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
                ▶ <span id="txtPlay">Tomosha qilish</span>
            </button>
        </div>
    </section>

    <!-- TV Channels Section with Logos -->
    <div class="section-header">
        <div class="section-title" id="txtTvHeader">Televideniye Kanallari</div>
    </div>

    <div class="horizontal-grid" id="channelsRow">
        <!-- JS orqali rasm va video manbalari yuklanadi -->
    </div>

    <!-- Movies Section -->
    <div class="section-header">
        <div class="section-title" id="txtMovieHeader">Premyera va Filmlar</div>
    </div>

    <div class="movies-grid" id="moviesGrid">
        <!-- JS orqali kinolar va muqobillar yuklanadi -->
    </div>

    <!-- Fullscreen Video Player -->
    <div class="modal-player" id="modalPlayer">
        <div class="player-bar">
            <span id="playerTitle" style="font-size:13px; font-weight:700;">Streaming...</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">✕</button>
        </div>
        <div class="player-viewport">
            <video id="activeVideo" controls playsinline></video>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span id="navHome">Asosiy</span>
        </div>
        <div class="nav-item" onclick="alert('Kanallar ro\'yxati')">
            <span class="nav-icon">📺</span>
            <span id="navTv">Kanallar</span>
        </div>
        <div class="nav-item" onclick="openSearch()">
            <span class="nav-icon">🔍</span>
            <span id="navSearch">Qidiruv</span>
        </div>
        <div class="nav-item" onclick="alert('Shaxsiy Profil')">
            <span class="nav-icon">👤</span>
            <span id="navProfile">Kabinet</span>
        </div>
    </nav>

    <script>
        // 5 Tilda Lug'at (UZ, RU, ENG, TJ, KZ)
        const translations = {
            uz: { premyera: "PREMYERA", play: "Tomosha qilish", tvHeader: "Televideniye Kanallari", movieHeader: "Premyera va Filmlar", home: "Asosiy", tv: "Kanallar", search: "Qidiruv", profile: "Kabinet" },
            ru: { premyera: "ПРЕМЬЕРА", play: "Смотреть", tvHeader: "Телеканалы", movieHeader: "Фильмы и Премьеры", home: "Главное", tv: "Каналы", search: "Поиск", profile: "Кабинет" },
            en: { premyera: "PREMIERE", play: "Watch Now", tvHeader: "TV Channels", movieHeader: "Movies & Premieres", home: "Home", tv: "Channels", search: "Search", profile: "Profile" },
            tj: { premyera: "ПРЕМЙЕРА", play: "Тошо кунед", tvHeader: "Каналҳои ТВ", movieHeader: "Филмҳо", home: "Асосӣ", tv: "Каналҳо", search: "Ҷустуҷӯ", profile: "Кабинет" },
            kz: { premyera: "ПРЕМЬЕРА", play: "Көру", tvHeader: "Телеарналар", movieHeader: "Фильмдер", home: "Басты", tv: "Арналар", search: "Издеу", profile: "Кабинет" }
        };

        function changeLanguage(lang) {
            const t = translations[lang];
            document.getElementById('txtPremyera').innerText = t.premyera;
            document.getElementById('txtPlay').innerText = t.play;
            document.getElementById('txtTvHeader').innerText = t.tvHeader;
            document.getElementById('txtMovieHeader').innerText = t.movieHeader;
            document.getElementById('navHome').innerText = t.home;
            document.getElementById('navTv').innerText = t.tv;
            document.getElementById('navSearch').innerText = t.search;
            document.getElementById('navProfile').innerText = t.profile;
        }

        // Soatni har soniyada yangilash
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('uz-UZ');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // TV Kanallar (Aniq Rasmlar va Videolar bilan)
        const tvChannels = [
            { name: "O'zbekiston 24", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d3/O%27zbekiston_24.png", epg: "Yangiliklar HD", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { name: "Sport TV", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Sport_Uzbekistan.png", epg: "Jonli Efir: Futbol", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            { name: "MY5", logo: "https://upload.wikimedia.org/wikipedia/commons/a/a2/MY5_TV.png", epg: "Ko'ngilochar Shou", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
            { name: "Euronews", logo: "https://upload.wikimedia.org/wikipedia/commons/2/29/Euronews_logo.svg", epg: "World News 24/7", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" },
            { name: "Perviy Kanal", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/1tv.svg/512px-1tv.svg.png", epg: "Vremya HD", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" }
        ];

        const channelsRow = document.getElementById('channelsRow');
        tvChannels.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.onclick = () => openPlayer(ch.name, ch.video);
            card.innerHTML = `
                <div class="channel-img-wrapper">
                    <img src="${ch.logo}" class="channel-img" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/60?text=TV'">
                </div>
                <div class="channel-name">${ch.name}</div>
                <div class="channel-epg">${ch.epg}</div>
            `;
            channelsRow.appendChild(card);
        });

        // Premyera Kinolar (Aniq Posteri va Videolari bilan)
        const movies = [
            { title: "Sintez (2026)", img: "https://picsum.photos/200/300?random=1", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoylikes.mp4" },
            { title: "Koinot Sarguzashtlari", img: "https://picsum.photos/200/300?random=2", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4" },
            { title: "Yulduzlar Jangi", img: "https://picsum.photos/200/300?random=3", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
            { title: "Poyga 3D", img: "https://picsum.photos/200/300?random=4", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutback2012.mp4" },
            { title: "Olimplar Afsonasi", img: "https://picsum.photos/200/300?random=5", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4" },
            { title: "Sehrli Olam", img: "https://picsum.photos/200/300?random=6", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCarCanYouGetForAGrand.mp4" }
        ];

        const moviesGrid = document.getElementById('moviesGrid');
        movies.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(m.title, m.video);
            card.innerHTML = `
                <img src="${m.img}" class="movie-poster" alt="${m.title}">
                <div class="movie-info">
                    <div class="movie-title">${m.title}</div>
                </div>
            `;
            moviesGrid.appendChild(card);
        });

        // Player Controls
        const modalPlayer = document.getElementById('modalPlayer');
        const activeVideo = document.getElementById('activeVideo');
        const playerTitle = document.getElementById('playerTitle');

        function openPlayer(title, url) {
            playerTitle.innerText = "IKROMJON TV — " + title;
            activeVideo.src = url;
            modalPlayer.classList.add('active');
            activeVideo.play().catch(e => console.log('Autoplay handled'));
        }

        function closePlayer() {
            activeVideo.pause();
            activeVideo.src = "";
            modalPlayer.classList.remove('active');
        }

        function openSearch() {
            const q = prompt("Qidiruv:");
            if(q) alert("'" + q + "' bo'yicha qidirilmoqda...");
        }
    </script>
</body>
</html>
