<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV — Enterprise IPTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-main: #02040a;
            --bg-card: rgba(13, 18, 30, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --accent-glow: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --border-glow: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.95);
        }

        :root[data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-glass: rgba(0, 0, 0, 0.03);
            --accent-glow: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --border-glow: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 198, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 114, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            padding-bottom: 120px; min-height: 100vh; overflow-x: hidden;
        }

        /* HEADER */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg-card);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-glow);
            padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
        }

        .brand-logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 19px; font-weight: 900; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, var(--text-sub));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .brand-logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: padding-box; -webkit-text-fill-color: #fff;
            padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
        }

        .header-badges { display: flex; align-items: center; gap: 8px; }
        .net-speed {
            background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981;
            font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 10px;
        }

        /* SEARCH BAR */
        .search-container { padding: 12px 20px 6px 20px; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 100%; background: var(--bg-glass); border: 1px solid var(--border-glow);
            padding: 12px 16px 12px 42px; border-radius: 16px; color: var(--text-main);
            font-size: 13px; font-weight: 600; outline: none; backdrop-filter: blur(15px); transition: all 0.3s;
        }
        .search-input:focus { border-color: var(--accent-glow); box-shadow: 0 0 20px rgba(0, 198, 255, 0.25); }
        .search-icon { position: absolute; left: 14px; font-size: 16px; opacity: 0.6; }

        /* HERO BANNER */
        .hero-section { padding: 10px 20px 16px 20px; }
        .hero-card {
            width: 100%; height: 230px; border-radius: 28px; padding: 24px;
            display: flex; flex-direction: column; justify-content: flex-end;
            border: 1px solid var(--border-glow);
            background: linear-gradient(180deg, rgba(2, 4, 10, 0) 10%, rgba(2, 4, 10, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
            position: relative; overflow: hidden; box-shadow: var(--card-shadow);
        }
        .hero-tag {
            background: var(--accent-gradient); color: #fff; font-size: 10px; font-weight: 900;
            padding: 5px 12px; border-radius: 20px; width: max-content; margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
        }
        .hero-title { font-size: 21px; font-weight: 900; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.9); }
        .play-btn {
            background: #ffffff; color: #000; border: none; padding: 10px 20px; border-radius: 14px;
            font-weight: 800; font-size: 12px; cursor: pointer; margin-top: 10px;
            display: inline-flex; align-items: center; gap: 8px; width: max-content;
            transition: all 0.3s; box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
        }

        /* CATEGORIES ROW */
        .category-container { display: flex; gap: 10px; padding: 0 20px 16px 20px; overflow-x: auto; scrollbar-width: none; }
        .category-container::-webkit-scrollbar { display: none; }
        .cat-box {
            background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 16px;
            padding: 10px 18px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.3s; backdrop-filter: blur(15px);
        }
        .cat-box:hover { border-color: var(--accent-glow); background: rgba(0, 198, 255, 0.1); }
        .cat-title { font-size: 12px; font-weight: 800; color: var(--text-main); white-space: nowrap; }

        /* SECTIONS & GRID */
        .section-header { padding: 16px 20px 10px 20px; display: flex; align-items: center; justify-content: space-between; }
        .section-title { font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }

        .horizontal-grid { display: flex; gap: 14px; padding: 0 20px 10px 20px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        /* CARDS DESIGN */
        .media-card {
            background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px;
            cursor: pointer; position: relative; flex-shrink: 0; overflow: hidden; backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--card-shadow);
        }
        .media-card:hover { transform: translateY(-5px); border-color: var(--accent-glow); box-shadow: 0 15px 35px rgba(0, 198, 255, 0.25); }

        .tv-card { width: 150px; }
        .tv-thumb-wrapper { width: 100%; height: 90px; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
        .tv-img { width: 70%; height: 70%; object-fit: contain; }

        .movie-card { width: 130px; }
        .movie-poster { width: 100%; height: 175px; object-fit: cover; }
        .movie-info { padding: 8px; display: flex; flex-direction: column; gap: 3px; }
        .movie-title { font-size: 11px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* IPTV IMPORT SECTION */
        .iptv-box {
            background: var(--bg-card); border: 1px dashed var(--accent-glow); border-radius: 20px;
            padding: 20px; margin: 10px 20px; display: flex; flex-direction: column; gap: 12px;
        }

        /* ADVANCED CINEMA PLAYER */
        .modal-player { position: fixed; inset: 0; z-index: 3000; background: #000; display: none; flex-direction: column; justify-content: space-between; }
        .modal-player.active { display: flex; }

        .player-header { padding: 16px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); display: flex; justify-content: space-between; align-items: center; color: #fff; z-index: 10; }
        .player-body { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .player-video { width: 100%; height: 100%; object-fit: contain; }
        .player-controls { padding: 20px; background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%); display: flex; flex-direction: column; gap: 12px; color: #fff; z-index: 10; }

        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
        .p-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid var(--border-glow); color: #fff; padding: 9px 12px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 11px; }
        .p-btn-main { background: var(--accent-gradient); color: #fff; border: none; padding: 11px 20px; border-radius: 14px; font-weight: 800; font-size: 14px; }

        /* FLOATING BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 450px; height: 64px;
            background: var(--bg-card); backdrop-filter: blur(30px);
            border: 1px solid var(--border-glow); border-radius: 32px;
            display: grid; grid-template-columns: repeat(3, 1fr); align-items: center;
            z-index: 200; box-shadow: var(--card-shadow);
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-sub); font-size: 9px; font-weight: 800; cursor: pointer; transition: all 0.3s; }
        .nav-item.active { color: var(--accent-glow); }

        .settings-modal { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; background: var(--bg-main); padding: 24px 20px 100px 20px; overflow-y: auto; }
        .settings-modal.active { display: flex; }
        .setting-group { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px; padding: 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
        .setting-group input, .setting-group select { background: var(--bg-glass); color: var(--text-main); border: 1px solid var(--border-glow); padding: 12px; border-radius: 12px; font-size: 12px; outline: none; }
        .btn-submit { background: var(--accent-gradient); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand-logo">IKROMJON <span>ENTERPRISE</span></div>
        <div class="header-badges">
            <div class="net-speed" id="netSpeedBadge">⚡ LIVE NET</div>
        </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Kanal yoki film nomini qidiring..." oninput="handleSearch(this.value)">
        </div>
    </div>

    <main id="mainView">
        <!-- M3U IMPORT QUICK BOX -->
        <div class="iptv-box">
            <div style="font-weight: 800; font-size: 13px;">📑 IPTV Pleylist Import (.m3u / .m3u8)</div>
            <input type="text" id="m3uUrlInput" class="search-input" placeholder="Pleylist havolasini kiriting (https://...)">
            <button class="btn-submit" onclick="importM3uPlaylist()">⚡ Yuklab olish va Bazasiga qoʻshish</button>
        </div>

        <!-- SEKTORLAR -->
        <div class="section-header"><div class="section-title">📡 Barcha Telekanallar</div></div>
        <div class="horizontal-grid" id="uzTvRow"></div>

        <div class="section-header"><div class="section-title">🔥 Premyeralar va Filmlar</div></div>
        <div class="horizontal-grid" id="premieresRow"></div>
    </main>

    <!-- SOZLAMALAR -->
    <div class="settings-modal" id="settingsView">
        <h2 style="margin-bottom:16px;">⚙️ Tizim Sozlamalari</h2>
        <div class="setting-group">
            <label>🎨 Interfeys Mavzusi:</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">🌑 Midnight Obsidian</option>
                <option value="light">☀️ Clean Light</option>
            </select>
        </div>
        <button class="btn-submit" onclick="resetDatabase()" style="background:#ef4444;">🗑️ Bazani tozalash</button>
    </div>

    <!-- PLEYER MODAL -->
    <div class="modal-player" id="modalPlayer">
        <div class="player-header">
            <span id="playerTitle" style="font-weight:800; font-size: 14px;">...</span>
            <button onclick="closePlayer()" style="background:rgba(255,255,255,0.12); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;">✕</button>
        </div>

        <div class="player-body">
            <video id="activeVideo" class="player-video" playsinline></video>
        </div>

        <div class="player-controls">
            <div class="controls-row" style="justify-content:center; gap:14px;">
                <button class="p-btn" onclick="seekVideo(-10)">⏪ -10s</button>
                <button class="p-btn-main" id="playPauseBtn" onclick="togglePlayPause()">▶ Play</button>
                <button class="p-btn" onclick="seekVideo(10)">+10s ⏩</button>
            </div>

            <div class="controls-row">
                <button class="p-btn" onclick="togglePip()">PiP 📱</button>
                <button class="p-btn" onclick="toggleFullScreen()">Toʻliq ekran ⛶</button>
            </div>
        </div>
    </div>

    <!-- FLOATING NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('main')"><span style="font-size:18px;">🏠</span><span>Asosiy</span></div>
        <div class="nav-item" onclick="switchTab('settings')"><span style="font-size:18px;">⚙️</span><span>Sozlama</span></div>
    </nav>

    <script>
        const defaultMediaData = [
            { id: 1, category: "uzTv", title: "O'zbekiston HD", img: "https://upload.wikimedia.org/wikipedia/commons/1/12/O%27zbekiston_TV_logo.png", stream: "https://live.mtrk.uz/hls/uzbekistan/index.m3u8" },
            { id: 2, category: "uzTv", title: "Yoshlar TV", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Yoshlar_TV_logo.svg/300px-Yoshlar_TV_logo.svg.png", stream: "https://live.mtrk.uz/hls/yoshlar/index.m3u8" },
            { id: 3, category: "premieres", title: "Interstellar", img: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg", stream: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
        ];

        let db;
        const request = indexedDB.open("IkromjonTV_EnterpriseDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (db.objectStoreNames.contains("mediaStore")) db.deleteObjectStore("mediaStore");
            db.createObjectStore("mediaStore", { keyPath: "id" });
        };
        request.onsuccess = (e) => { db = e.target.result; checkDataAndRender(); };

        function checkDataAndRender() {
            getAllMedia((items) => {
                if (items.length === 0) {
                    const tx = db.transaction("mediaStore", "readwrite");
                    defaultMediaData.forEach(item => tx.objectStore("mediaStore").put(item));
                    tx.oncomplete = () => renderAllContent();
                } else { renderAllContent(); }
            });
        }

        function getAllMedia(callback) {
            const tx = db.transaction("mediaStore", "readonly");
            const req = tx.objectStore("mediaStore").getAll();
            req.onsuccess = () => callback(req.result);
        }

        /* M3U IPTV PARSER ENGINE */
        async function importM3uPlaylist() {
            const url = document.getElementById('m3uUrlInput').value;
            if (!url) return alert("Iltimos, M3U havolasini kiriting!");

            try {
                const response = await fetch(url);
                const text = await response.text();
                const lines = text.split('\n');
                
                let currentTitle = "";
                let count = 0;
                const tx = db.transaction("mediaStore", "readwrite");

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        currentTitle = line.split(',')[1] || "IPTV Kanal";
                    } else if (line.startsWith('http')) {
                        const newObj = {
                            id: Date.now() + Math.random(),
                            category: "uzTv",
                            title: currentTitle || "IPTV Stream",
                            img: "https://picsum.photos/200/200",
                            stream: line
                        };
                        tx.objectStore("mediaStore").put(newObj);
                        count++;
                    }
                }

                tx.oncomplete = () => {
                    alert(`${count} ta IPTV kanali muvaffaqiyatli yuklandi! 🎉`);
                    renderAllContent();
                };
            } catch (err) { alert("Pleylistni yuklab bo'lmadi! CORS yoki havola xatosi."); }
        }

        function resetDatabase() {
            const tx = db.transaction("mediaStore", "readwrite");
            tx.objectStore("mediaStore").clear();
            tx.oncomplete = () => { alert("Baza tozalandi!"); renderAllContent(); };
        }

        function handleSearch(query) {
            const f = query.toLowerCase();
            getAllMedia(items => renderCards(items.filter(i => i.title.toLowerCase().includes(f))));
        }

        function renderAllContent() { getAllMedia(items => renderCards(items)); }

        function renderCards(items) {
            ['uzTv', 'premieres'].forEach(r => {
                const el = document.getElementById(r + 'Row'); if (el) el.innerHTML = '';
            });

            items.forEach(item => {
                const container = document.getElementById(item.category + 'Row') || document.getElementById('uzTvRow');
                if (container) container.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            if (item.category === 'uzTv') {
                card.className = 'media-card tv-card';
                card.onclick = () => playStream(item.title, item.stream);
                card.innerHTML = `<div class="tv-thumb-wrapper"><img src="${item.img}" class="tv-img"></div><div class="movie-info"><div class="movie-title">${item.title}</div></div>`;
            } else {
                card.className = 'media-card movie-card';
                card.onclick = () => playStream(item.title, item.stream);
                card.innerHTML = `<img src="${item.img}" class="movie-poster"><div class="movie-info"><div class="movie-title">${item.title}</div></div>`;
            }
            return card;
        }

        /* PLEYER ENGINE WITH AUTO-RECONNECT */
        let hls = null;
        const video = document.getElementById('activeVideo');
        const playBtn = document.getElementById('playPauseBtn');

        function playStream(title, url) {
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('modalPlayer').classList.add('active');
            if (hls) hls.destroy();

            if (url.includes('.m3u8') && Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 30, liveSyncDurationCount: 3 });
                hls.loadSource(url); 
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); playBtn.innerText = "⏸ Pause"; });
                
                // Auto reconnect on network error
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) hls.startLoad();
                });
            } else {
                video.src = url; video.play(); playBtn.innerText = "⏸ Pause";
            }
        }

        function togglePlayPause() { if (video.paused) { video.play(); playBtn.innerText = "⏸ Pause"; } else { video.pause(); playBtn.innerText = "▶ Play"; } }
        function seekVideo(s) { video.currentTime += s; }
        function togglePip() { if (document.pictureInPictureElement) document.exitPictureInPicture(); else video.requestPictureInPicture(); }
        function toggleFullScreen() { if (!document.fullscreenElement) document.getElementById('modalPlayer').requestFullscreen(); else document.exitFullscreen(); }

        function closePlayer() {
            video.pause(); video.src = "";
            if (hls) { hls.destroy(); hls = null; }
            document.getElementById('modalPlayer').classList.remove('active');
        }

        function switchTab(tab) {
            document.getElementById('settingsView').classList.remove('active');
            if (tab === 'settings') document.getElementById('settingsView').classList.add('active');
        }

        function changeTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }
    </script>
</body>
</html>
