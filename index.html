<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV — Онлайн Телевидение va Kinoteatr</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e14;
            --card-bg: #151a23;
            --card-hover: #1e2532;
            --accent-blue: #2563eb;
            --accent-light: #60a5fa;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 70px;
            min-height: 100vh;
        }

        /* Top Header Navigation */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            background: linear-gradient(135deg, var(--accent-light), var(--accent-blue));
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        /* Hero Banner Slider */
        .hero-section {
            padding: 16px;
        }

        .hero-banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(11,14,20,0.95) 100%), 
                        url('https://picsum.photos/800/400?random=1') center/cover;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        .hero-tag {
            background: var(--accent-blue);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            width: max-content;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .hero-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .play-now-btn {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: max-content;
            cursor: pointer;
        }

        /* Categories Row (TVCOM Tabs) */
        .category-scroll {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-chip.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        /* Section Title */
        .section-header {
            padding: 0 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
        }

        .see-all {
            font-size: 12px;
            color: var(--accent-light);
            font-weight: 600;
            text-decoration: none;
        }

        /* Content Horizontal Carousel */
        .horizontal-grid {
            display: flex;
            gap: 12px;
            padding: 0 16px 20px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        /* TV Channel Card (TVCOM Style) */
        .channel-card-tvcom {
            min-width: 130px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .channel-card-tvcom:active { background: var(--card-hover); }

        .channel-logo-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1e2532;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .channel-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .channel-epg {
            font-size: 10px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 110px;
        }

        /* Movie Card Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 16px 20px 16px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .movie-poster {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #1e2532;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-genre {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-light);
        }

        .nav-icon { font-size: 18px; }

        /* Video Player Modal */
        .modal-player {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .modal-player.active { display: flex; }

        .player-bar {
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        .player-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video { width: 100%; max-height: 80vh; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="brand-logo">
            IKROMJON <span>TV</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openSearch()">🔍</button>
            <button class="icon-btn" onclick="alert('Xabarlar yo\'q')">🔔</button>
        </div>
    </header>

    <!-- Main Hero Slider -->
    <section class="hero-section">
        <div class="hero-banner">
            <div class="hero-tag">PREMYERA</div>
            <div class="hero-title">Eksklyuziv Kinolar</div>
            <div class="hero-sub">Full HD va Uzbek tilida tomosha qiling</div>
            <button class="play-now-btn" onclick="openPlayer('Premyera Kino', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
                ▶ Tomosha qilish
            </button>
        </div>
    </section>

    <!-- Category Tabs -->
    <div class="category-scroll">
        <div class="cat-chip active">Barchasi</div>
        <div class="cat-chip" onclick="filterCat('tv')">TV Kanallar</div>
        <div class="cat-chip" onclick="filterCat('movies')">Filmlar</div>
        <div class="cat-chip" onclick="filterCat('series')">Seriallar</div>
        <div class="cat-chip" onclick="filterCat('cartoons')">Multfilmlar</div>
        <div class="cat-chip" onclick="filterCat('sport')">Sport</div>
    </div>

    <!-- Section: Popular TV Channels -->
    <div class="section-header">
        <div class="section-title">Ommabop TV Kanallar</div>
        <a href="#" class="see-all">Barchasi ›</a>
    </div>

    <div class="horizontal-grid" id="channelsRow">
        <!-- JS bilan to'ldiriladi -->
    </div>

    <!-- Section: Top Movies Grid -->
    <div class="section-header">
        <div class="section-title">Yangi Filmlar va Premyeralar</div>
        <a href="#" class="see-all">Barchasi ›</a>
    </div>

    <div class="movies-grid" id="moviesGrid">
        <!-- JS bilan to'ldiriladi -->
    </div>

    <!-- Video Player Modal -->
    <div class="modal-player" id="modalPlayer">
        <div class="player-bar">
            <span id="playerTitle" style="font-size:14px; font-weight:700;">Efir</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div class="player-viewport">
            <video id="activeVideo" controls playsinline></video>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Asosiy</span>
        </div>
        <div class="nav-item" onclick="alert('TV Kanallar bo\'limi')">
            <span class="nav-icon">📺</span>
            <span>TV Kanallar</span>
        </div>
        <div class="nav-item" onclick="openSearch()">
            <span class="nav-icon">🔍</span>
            <span>Qidiruv</span>
        </div>
        <div class="nav-item" onclick="alert('Profil va Sozlamalar')">
            <span class="nav-icon">👤</span>
            <span>Kabinet</span>
        </div>
    </nav>

    <script>
        // TVCOM TV Kanallar ro'yxati
        const tvChannels = [
            { name: "O'zbekiston 24", logo: "UZ24", epg: "Yangiliklar HD" },
            { name: "FTV", logo: "FTV", epg: "Musiqiy kliplar" },
            { name: "Sport TV", logo: "SPORT", epg: "Jonli efir: Futbol" },
            { name: "Sevimlilar", logo: "SEV", epg: "Milliy seriallar" },
            { name: "KinoPremyera", logo: "KINO", epg: "Jangarli film 2026" },
            { name: "MY5", logo: "MY5", epg: "Ko'ngilochar shou" }
        ];

        const channelsRow = document.getElementById('channelsRow');
        tvChannels.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card-tvcom';
            card.onclick = () => openPlayer(ch.name, 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4');
            card.innerHTML = `
                <div class="channel-logo-wrapper">${ch.logo}</div>
                <div class="channel-name">${ch.name}</div>
                <div class="channel-epg">${ch.epg}</div>
            `;
            channelsRow.appendChild(card);
        });

        // Kinolar Ro'yxati
        const movies = [
            { title: "Forsaj X", genre: "Jangarli", img: "https://picsum.photos/200/300?random=10" },
            { title: "Avatar 2", genre: "Fantastika", img: "https://picsum.photos/200/300?random=11" },
            { title: "Oppenheimer", genre: "Drama", img: "https://picsum.photos/200/300?random=12" },
            { title: "Spider-Man", genre: "Sarguzasht", img: "https://picsum.photos/200/300?random=13" },
            { title: "Mavsum 3", genre: "Multfilm", img: "https://picsum.photos/200/300?random=14" },
            { title: "Batman", genre: "Triller", img: "https://picsum.photos/200/300?random=15" }
        ];

        const moviesGrid = document.getElementById('moviesGrid');
        movies.forEach(m => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => openPlayer(m.title, 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4');
            card.innerHTML = `
                <img src="${m.img}" class="movie-poster" alt="${m.title}">
                <div class="movie-info">
                    <div class="movie-title">${m.title}</div>
                    <div class="movie-genre">${m.genre}</div>
                </div>
            `;
            moviesGrid.appendChild(card);
        });

        // Player Modali Control
        const modalPlayer = document.getElementById('modalPlayer');
        const activeVideo = document.getElementById('activeVideo');
        const playerTitle = document.getElementById('playerTitle');

        function openPlayer(title, url) {
            playerTitle.innerText = "IKROMJON TV — " + title;
            activeVideo.src = url;
            modalPlayer.classList.add('active');
            activeVideo.play().catch(e => console.log('Autoplay restrictions'));
        }

        function closePlayer() {
            activeVideo.pause();
            activeVideo.src = "";
            modalPlayer.classList.remove('active');
        }

        function openSearch() {
            const q = prompt("IKROMJON TV bo'yicha qidiruv:");
            if(q) alert("'" + q + "' bo'yicha qidirilmoqda...");
        }

        function filterCat(type) {
            alert(type.toUpperCase() + " bo'limiga o'tildi.");
        }
    </script>
</body>
</html>
