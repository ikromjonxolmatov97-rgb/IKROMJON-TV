<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #080b13;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* 1. LOADING SCREEN */
        #appLoaderScreen {
            position: fixed;
            inset: 0;
            background: #05070d;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-logo {
            font-size: 26px;
            font-weight: 900;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .loader-progress-box {
            width: 80%;
            max-width: 300px;
            background: #111a2e;
            height: 10px;
            border-radius: 20px;
            border: 1px solid #1e2d4a;
            overflow: hidden;
        }

        .loader-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #00d2ff);
            border-radius: 20px;
            transition: width 0.05s linear;
        }

        .loader-status-text {
            margin-top: 12px;
            font-size: 13px;
            color: #00d2ff;
            font-weight: bold;
        }

        /* 2. HEADER & PLAYER */
        header {
            background: #0d1527;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #1a263d;
        }

        .header-title { font-size: 16px; font-weight: 800; color: #00d2ff; }

        .player-box {
            width: 100%;
            background-color: #000;
            aspect-ratio: 16 / 9;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .now-playing {
            padding: 10px 15px;
            background: #0f172a;
            font-size: 12px;
            color: #00d2ff;
            border-bottom: 1px solid #1e293b;
        }

        /* 3. CATEGORIES & CARDS */
        .categories-section { padding: 12px; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .cat-btn {
            background: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            color: #fff;
            cursor: pointer;
        }
        .cat-btn.active { background: #0088ff; border-color: #00d2ff; }

        .content-list { padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
        .video-card {
            background: #111a2e;
            border: 1px solid #1a2942;
            border-radius: 8px;
            display: flex;
            padding: 8px;
            gap: 10px;
            align-items: center;
            cursor: pointer;
        }
        .video-card:active { background: #1a2744; }
        .play-icon { font-size: 18px; color: #00d2ff; }
        .video-info { flex: 1; }
        .video-title { font-size: 12px; font-weight: bold; color: #fff; }
        .video-meta { font-size: 10px; color: #94a3b8; margin-top: 2px; }

        /* 4. SUPPORT SECTION */
        .support-box {
            margin: 10px 12px 20px 12px;
            background: #111a2e;
            border: 1px solid #0088ff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.15);
        }
        .support-title {
            font-size: 13px;
            font-weight: bold;
            color: #00d2ff;
            margin-bottom: 6px;
        }
        .support-desc {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .support-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(90deg, #0088ff, #00d2ff);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* 5. BOTTOM NAV (6 TA FUNKSIYA) */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 55px;
            background: #0b1120;
            border-top: 1px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            align-items: center;
            z-index: 200;
        }
        .nav-item { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 8px; 
            cursor: pointer; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .nav-item.active { color: #0088ff; }
        .nav-icon { font-size: 14px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="appLoaderScreen">
        <div class="loader-logo">IKROMJON TV</div>
        <div class="loader-progress-box">
            <div class="loader-progress-bar" id="loaderBar"></div>
        </div>
        <div class="loader-status-text"><span id="loaderPercent">0</span>%</div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-title">IKROMJON TV</div>
    </header>

    <!-- PLAYER -->
    <div class="player-box">
        <iframe id="main-player" src="https://www.youtube.com/embed/VyHV0BRMYEA" allowfullscreen></iframe>
    </div>
    <div class="now-playing">
        🔴 <span id="playingTitle">Harry Potter va Hikmatlar Tosh</span>
    </div>

    <!-- KATEGORIYALAR -->
    <div class="categories-section">
        <div class="category-grid">
            <div class="cat-btn active" onclick="loadCat('tv', this)">📺 TV</div>
            <div class="cat-btn" onclick="loadCat('harry', this)">🧙‍♂️ Potter</div>
            <div class="cat-btn" onclick="loadCat('retro', this)">🎞️ Retro</div>
            <div class="cat-btn" onclick="loadCat('uz_klip', this)">🎵 Kliplar</div>
        </div>
    </div>

    <!-- VIDEO RO'YXATI -->
    <div class="content-list" id="videoList"></div>

    <!-- QO'LLAB-QUVVATLASH BO'LIMI -->
    <div class="support-box" id="supportArea">
        <div class="support-title">🎧 Qo‘llab-quvvatlash mutaxassisi</div>
        <div class="support-desc">Ilovada biror muammo yoki taklifingiz bormi? Mutaxassis bilan bog‘laning.</div>
        <a href="https://t.me/telegram" target="_blank" class="support-btn">
            💬 Telegram orqali yozish
        </a>
    </div>

    <!-- NAVIGATSIYA (6 TA TUGMA) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})"><span class="nav-icon">🏠</span>Asosiy</div>
        <div class="nav-item" onclick="loadCat('tv', null)"><span class="nav-icon">📡</span>TV</div>
        <div class="nav-item" onclick="promptSearch()"><span class="nav-icon">🔍</span>Qidiruv</div>
        <div class="nav-item" onclick="loadCat('harry', null)"><span class="nav-icon">⚡</span>Potter</div>
        <div class="nav-item" onclick="scrollToSupport()"><span class="nav-icon">🎧</span>Yordam</div>
        <div class="nav-item" onclick="alert('IKROMJON TV Profil Bo\'limi')"><span class="nav-icon">👤</span>Profil</div>
    </div>

    <script>
        // 1. Loading Controller
        window.addEventListener('load', () => {
            let count = 0;
            const loaderBar = document.getElementById('loaderBar');
            const loaderPercent = document.getElementById('loaderPercent');
            const loaderScreen = document.getElementById('appLoaderScreen');

            const interval = setInterval(() => {
                count += 5;
                if (count >= 100) {
                    count = 100;
                    loaderBar.style.width = '100%';
                    loaderPercent.innerText = '100';
                    clearInterval(interval);

                    setTimeout(() => {
                        loaderScreen.style.opacity = '0';
                        loaderScreen.style.visibility = 'hidden';
                    }, 300);
                } else {
                    loaderBar.style.width = count + '%';
                    loaderPercent.innerText = count;
                }
            }, 30);
        });

        // 2. Data
        const data = {
            tv: [
                { title: "MY5 TV Jonli", url: "https://www.youtube.com/embed/jfKfPfyJRdk", meta: "TV Kanal" },
                { title: "Sevimli TV Onlayn", url: "https://www.youtube.com/embed/VyHV0BRMYEA", meta: "TV Kanal" },
                { title: "Milliy TV Stream", url: "https://www.youtube.com/embed/1bq0qff4iSU", meta: "TV Kanal" }
            ],
            harry: [
                { title: "Harry Potter 1-qism", url: "https://www.youtube.com/embed/VyHV0BRMYEA", meta: "Hikmatlar Tosh" },
                { title: "Harry Potter 2-qism", url: "https://www.youtube.com/embed/1bq0qff4iSU", meta: "Sirlar Xonasi" },
                { title: "Harry Potter 3-qism", url: "https://www.youtube.com/embed/lAxgztbYDbs", meta: "Azkaban Mahbusi" }
            ],
            retro: [
                { title: "Kavkaz Asirasi", url: "https://www.youtube.com/embed/5qap5aO4i9A", meta: "Retro Film" },
                { title: "Abdullajon", url: "https://www.youtube.com/embed/5qap5aO4i9A", meta: "O'zbek Kino" }
            ],
            uz_klip: [
                { title: "Munisa Rizayeva - O'ylama", url: "https://www.youtube.com/embed/5D_1mGz1p6E", meta: "Premyera" },
                { title: "Jaloliddin A. - Yomon ekan", url: "https://www.youtube.com/embed/2g81116hA68", meta: "Musiqa" }
            ]
        };

        // 3. Actions
        function playVideo(url, title) {
            document.getElementById('main-player').src = url + "?autoplay=1";
            document.getElementById('playingTitle').innerText = title;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadCat(key, elem) {
            if(elem) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                elem.classList.add('active');
            }
            const container = document.getElementById('videoList');
            container.innerHTML = '';
            
            (data[key] || data['tv']).forEach(item => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(item.url, item.title);
                card.innerHTML = `
                    <div class="play-icon">▶</div>
                    <div class="video-info">
                        <div class="video-title">${item.title}</div>
                        <div class="video-meta">${item.meta}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function scrollToSupport() {
            document.getElementById('supportArea').scrollIntoView({ behavior: 'smooth' });
        }

        function promptSearch() {
            let query = prompt("Qidirayotgan kinoyingiz yoki kanalingiz nomini kiriting:");
            if(query) {
                alert("'" + query + "' bo'yicha qidiruv natijalari tayyorlanmoqda...");
            }
        }

        // Init
        loadCat('tv', null);
    </script>
</body>
</html>
