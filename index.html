<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070614;
            --card-bg: rgba(22, 18, 42, 0.85);
            --border-glow: rgba(147, 51, 234, 0.4);
            --primary-purple: #9333ea;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --live-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(147, 51, 234, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.2) 0%, transparent 40%);
            color: var(--text-main);
            padding-bottom: 80px;
            min-height: 100vh;
        }

        /* Top Welcome Header */
        .welcome-header {
            text-align: center;
            padding: 20px 16px 10px 16px;
        }
        .welcome-header h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        /* Clock Section */
        .clock-section {
            padding: 10px 16px 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .analog-clock {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--primary-purple);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.5), inset 0 0 10px rgba(0,0,0,0.9);
            position: relative;
            background: rgba(10, 8, 20, 0.95);
            margin-bottom: 8px;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }
        .hour-hand { width: 4px; height: 26px; background: var(--accent-pink); }
        .minute-hand { width: 3px; height: 38px; background: var(--accent-cyan); }
        .second-hand { width: 2px; height: 44px; background: var(--live-red); }
        .clock-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .digital-time {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
            background: rgba(15, 12, 29, 0.9);
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
        }

        .section-title {
            padding: 12px 16px 8px 16px;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* 10 Ta Surilib O'tadigan Anonslar (Carousel) */
        .anons-carousel {
            display: flex;
            gap: 12px;
            padding: 0 16px 16px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .anons-carousel::-webkit-scrollbar { display: none; }

        .anons-card {
            min-width: 220px;
            height: 120px;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(6, 182, 212, 0.25));
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .anons-badge {
            background: var(--live-red);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            width: max-content;
        }
        .anons-title {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* To'rtburchak Shakldagi Ketma-ket Bo'limlar Grid */
        .grid-sections {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px 16px 16px;
        }

        .rect-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .rect-card:active {
            transform: scale(0.97);
            background: rgba(147, 51, 234, 0.3);
        }
        .rect-icon {
            font-size: 24px;
            width: 44px;
            height: 44px;
            background: rgba(147, 51, 234, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .rect-info .num {
            font-size: 10px;
            color: var(--accent-pink);
            font-weight: 800;
        }
        .rect-info .name {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Munajjimlar Bashorati Bloki */
        .horoscope-box {
            margin: 0 16px 16px 16px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(147, 51, 234, 0.2));
            border: 1px solid var(--accent-pink);
            border-radius: 14px;
            padding: 16px;
        }
        .horoscope-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--accent-pink);
        }
        .horoscope-text {
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        /* Brauzer / Pleyer Modal Oynasi (YouTube O'rniga) */
        .player-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        .player-modal.active { display: flex; }

        .player-top-bar {
            padding: 14px 16px;
            background: #110e21;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow);
        }

        .browser-screen {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }
        .browser-screen video {
            width: 100%;
            max-height: 100%;
        }

        /* Audio Player Control Indicator (Fon Musiqasi uchun) */
        .audio-float-btn {
            position: fixed;
            bottom: 75px;
            right: 16px;
            background: var(--primary-purple);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--primary-purple);
            cursor: pointer;
            z-index: 100;
            font-size: 18px;
            animation: spinAudio 4s linear infinite;
        }
        @keyframes spinAudio {
            0% { box-shadow: 0 0 10px var(--primary-purple); }
            50% { box-shadow: 0 0 20px var(--accent-pink); }
            100% { box-shadow: 0 0 10px var(--primary-purple); }
        }
    </style>
</head>
<body>

    <!-- Fon Musiqasi (Avtomatik ishga tushadi) -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="audio-float-btn" onclick="toggleAudio()" title="Musiqani yoqish/o'chirish" id="audioBtn">🎵</div>

    <!-- 1. Yirik Sarlavha -->
    <div class="welcome-header">
        <h1>IKROMJON TV GA HUSH KELIBSIZ</h1>
    </div>

    <!-- 2. Soat Vaqti -->
    <div class="clock-section">
        <div class="analog-clock">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="clock-center"></div>
        </div>
        <div class="digital-time" id="digitalTime">00:00:00</div>
    </div>

    <!-- 3. 10 Tacha Surilib O'tadigan Anonslar -->
    <div class="section-title">✨ Qaynoq Anonslar</div>
    <div class="anons-carousel" id="anonsCarousel">
        <!-- JS orqali 10 ta anons qo'shiladi -->
    </div>

    <!-- 4. Kunlik Munajjimlar Bashorati -->
    <div class="section-title">🔮 Kunlik Munajjimlar Bashorati</div>
    <div class="horoscope-box">
        <div class="horoscope-header">
            <span>⭐ Bugungi Yulduzlar Bashorati</span>
        </div>
        <div class="horoscope-text" id="horoscopeText">
            Bugun ijodiy ishlarda katta muvaffaqiyatlar kutilmoqda. Yangi loyihalarni boshlash uchun qulay vaqt. Oila davrasida iliq xabarlar eshitasiz.
        </div>
    </div>

    <!-- 5. To'rtburchak Shakldagi Ketma-ket Bo'limlar -->
    <div class="section-title">📁 Barcha Bo'limlar</div>
    <div class="grid-sections" id="gridSections">
        <!-- JS orqali to'rtburchak bo'limlar -->
    </div>

    <!-- 6. Video Brauzer Pleyer (YouTube o'rniga maxsus pleyer) -->
    <div class="player-modal" id="playerModal">
        <div class="player-top-bar">
            <span id="playerTitle" style="font-weight: 700; font-size: 14px; color: var(--accent-cyan);">Brauzer Pleyer</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">✕</button>
        </div>
        <div class="browser-screen">
            <video id="activeVideo" controls playsinline></video>
        </div>
    </div>

    <script>
        // Fon Musiqasini Brauzer ruxsati bilan yoqish
        window.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(e => console.log('Audio autoplay restricted'));
            }
        }, { once: true });

        function toggleAudio() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('audioBtn');
            if (music.paused) {
                music.play();
                btn.style.opacity = '1';
            } else {
                music.pause();
                btn.style.opacity = '0.5';
            }
        }

        // 10 Ta Anonslar Ma'lumotlar Bazasi
        const anonsList = [
            { title: "01. Jonli Efirda maxsus shou start oldi!", tag: "PREMYERA" },
            { title: "02. Yangi eksklyuziv filmlar premyerasi", tag: "KINO" },
            { title: "03. Eng so'nggi qiziqarli seriallar", tag: "SERIAL" },
            { title: "04. Saralangan anime olami yangiliklari", tag: "ANIME" },
            { title: "05. Bolajonlar uchun sevimli multfilmlar", tag: "MULTFILM" },
            { title: "06. Haftaning eng sara ko'rsatuvlari", tag: "SHOU" },
            { title: "07. Sport olamidagi eng muhim uchrashuvlar", tag: "SPORT" },
            { title: "08. Hit musiqiy qo'shiqlar va konsertlar", tag: "MUSIQA" },
            { title: "09. Bolalar uchun rivojlantiruvchi darslar", tag: "BOLALAR" },
            { title: "10. Dunyo va mahalliy eng so'nggi yangiliklar", tag: "YANGILIK" }
        ];

        const anonsCarousel = document.getElementById('anonsCarousel');
        anonsList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'anons-card';
            card.onclick = () => openPlayer(item.title, 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4');
            card.innerHTML = `
                <div class="anons-badge">${item.tag}</div>
                <div class="anons-title">${item.title}</div>
                <div style="font-size:10px; color: var(--accent-cyan); font-weight: 700;">Ko'rish uchun bosing →</div>
            `;
            anonsCarousel.appendChild(card);
        });

        // 10 Ta To'rtburchak Bo'limlar
        const categories = [
            { id: "01", name: "JONLI EFIR", icon: "📡", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { id: "02", name: "FILMLAR", icon: "🎬", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            { id: "03", name: "SERIALAR", icon: "🎞️", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
            { id: "04", name: "ANIMELAR", icon: "👾", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" },
            { id: "05", name: "MULTFILMLAR", icon: "🧸", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" },
            { id: "06", name: "KO'RSATUVLAR", icon: "📺", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" },
            { id: "07", name: "SPORT", icon: "⚽", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4" },
            { id: "08", name: "MUSIQA", icon: "🎵", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
            { id: "09", name: "BOLALAR UCHUN", icon: "👶", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackToys.mp4" },
            { id: "10", name: "YANGILIKLAR", icon: "📰", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
        ];

        const gridSections = document.getElementById('gridSections');
        categories.forEach(cat => {
            const rect = document.createElement('div');
            rect.className = 'rect-card';
            rect.onclick = () => openPlayer(cat.name, cat.url);
            rect.innerHTML = `
                <div class="rect-icon">${cat.icon}</div>
                <div class="rect-info">
                    <div class="num">BO'LIM ${cat.id}</div>
                    <div class="name">${cat.name}</div>
                </div>
            `;
            gridSections.appendChild(rect);
        });

        // Soat Ishlashi (Toshkent vaqti)
        function updateClock() {
            const now = new Date();
            const secs = now.getSeconds();
            const mins = now.getMinutes();
            const hrs = now.getHours();

            document.getElementById('secondHand').style.transform = `rotate(${(secs / 60) * 360}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${((mins + secs/60) / 60) * 360}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${((hrs % 12 + mins/60) / 12) * 360}deg)`;

            document.getElementById('digitalTime').innerText = now.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Pleyer Boshqaruvi (Brauzer rejimi)
        const playerModal = document.getElementById('playerModal');
        const activeVideo = document.getElementById('activeVideo');
        const playerTitle = document.getElementById('playerTitle');

        function openPlayer(title, url) {
            playerTitle.innerText = "IKROMJON TV — " + title;
            activeVideo.src = url;
            playerModal.classList.add('active');
            activeVideo.play().catch(e => console.log('Play error'));
        }

        function closePlayer() {
            activeVideo.pause();
            activeVideo.src = '';
            playerModal.classList.remove('active');
        }

        // Kunlik Munajjimlar bashorati generatori
        const horoTexts = [
            "Bugun o'zingizga bo'lgan ishonch yuqori bo'ladi. Har qanday murakkab vazifani oson hal qilasiz.",
            "Moliyaviy masalalarda e'tiborli bo'ling, kutilmagan foyda yoki sovg'a kelishi mumkin.",
            "Yangi tanishuvlar kelajakdagi rejalaringizga ijobiy ta'sir ko'rsatadi.",
            "Sog'ligingizga e'tibor qaratib, ochiq havoda ko'proq sayr qilish tavsiya etiladi."
        ];
        document.getElementById('horoscopeText').innerText = horoTexts[new Date().getDate() % horoTexts.length];
    </script>
</body>
</html>
