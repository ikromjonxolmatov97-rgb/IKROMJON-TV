<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKROMJON TV</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --primary: #6366f1;
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        /* Top Header */
        header {
            background: #0f172a;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
        }

        /* Sticky Player Container */
        .player-container {
            width: 100%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            max-height: 220px;
            display: block;
            background: #000;
            outline: none;
        }

        .video-title-bar {
            padding: 10px 16px;
            background: #111827;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Search Input Bar */
        .search-box {
            padding: 10px 16px;
            display: none;
            background: #111827;
        }

        .search-box.active {
            display: block;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--card-bg);
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        /* Section Titles */
        .section-title {
            padding: 14px 16px 6px 16px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        /* Categories */
        .categories {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 8px 16px;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            color: var(--text-main);
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .cat-btn.active {
            background: var(--primary);
            border-color: var(--accent);
            font-weight: 600;
        }

        .cat-btn span {
            display: block;
            font-size: 16px;
            margin-bottom: 2px;
        }

        /* Playlist UI */
        .playlist {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.15s;
        }

        .item-card:active {
            background: rgba(99, 102, 241, 0.25);
        }

        .item-card.playing {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            font-size: 13px;
            font-weight: 600;
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .play-icon {
            width: 28px;
            height: 28px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 11px;
            flex-shrink: 0;
        }

        .empty-msg {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Bottom Navbar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #0f172a;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            align-items: center;
            z-index: 200;
        }

        .nav-btn {
            color: var(--text-muted);
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            padding: 4px 0;
        }

        .nav-btn.active {
            color: var(--accent);
            font-weight: 600;
        }

        .nav-btn div {
            font-size: 16px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="badge">IK</span> IKROMJON TV
        </div>
        <div id="clock" style="font-size: 11px; color: var(--text-muted); font-weight: 500;">00:00</div>
    </header>

    <!-- Video Player Area -->
    <div class="player-container">
        <video id="appPlayer" controls playsinline poster="https://via.placeholder.com/600x340/161e2e/ffffff?text=IKROMJON+TV">
            <source id="videoSource" src="" type="video/mp4">
            Brauzeringiz videoni qo'llab-quvvatlamaydi.
        </video>
        <div class="video-title-bar">
            <span id="currentTitle">Media tanlanmagan</span>
            <span id="statusBadge" style="font-size: 10px; color: var(--text-muted);">TAYYOR</span>
        </div>
        <div class="search-box" id="searchBox">
            <input type="text" id="searchInput" placeholder="Nomi bo'yicha qidiring..." oninput="filterMedia(this.value)">
        </div>
    </div>

    <!-- Category Selector -->
    <div class="section-title">Bo'limlar</div>
    <div class="categories">
        <button class="cat-btn active" data-cat="tv">
            <span>📺</span>TV
        </button>
        <button class="cat-btn" data-cat="kinolar">
            <span>🎬</span>Kinolar
        </button>
        <button class="cat-btn" data-cat="musiqa">
            <span>🎵</span>Musiqa
        </button>
        <button class="cat-btn" data-cat="sport">
            <span>⚽</span>Sport
        </button>
    </div>

    <!-- Playlist Container -->
    <div class="section-title" id="listTitle">Mavjud Efirlar</div>
    <div class="playlist" id="playlist"></div>

    <!-- Bottom Navigation -->
    <nav class="navbar">
        <div class="nav-btn active" data-nav="tv" onclick="switchCategory('tv')">
            <div>📺</div>Asosiy
        </div>
        <div class="nav-btn" data-nav="kinolar" onclick="switchCategory('kinolar')">
            <div>🎥</div>Kinolar
        </div>
        <div class="nav-btn" id="searchNavBtn" onclick="toggleSearch()">
            <div>🔍</div>Qidiruv
        </div>
        <div class="nav-btn" onclick="showSettings()">
            <div>⚙️</div>Sozlama
        </div>
    </nav>

    <script>
        // Media BAZASI (Doimiy ishlaydigan xavfsiz MP4 manbalar)
        const mediaDatabase = {
            tv: [
                { id: 1, title: "Big Buck Bunny (Demo TV)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", type: "HD • Jonli Efir" },
                { id: 2, title: "Elephants Dream (Kanal 2)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", type: "Full HD • Efir" }
            ],
            kinolar: [
                { id: 3, title: "For Bigger Blazes", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", type: "Kino • 1080p" },
                { id: 4, title: "For Bigger Escapes", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", type: "Kino • Action" }
            ],
            musiqa: [
                { id: 5, title: "Tears of Steel (Musiqiy Klip)", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", type: "Music • HD" }
            ],
            sport: [
                { id: 6, title: "Subaru OutBack Sport", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackToys.mp4", type: "Sport • Auto" }
            ]
        };

        // DOM Elementlari
        const player = document.getElementById('appPlayer');
        const videoSource = document.getElementById('videoSource');
        const currentTitle = document.getElementById('currentTitle');
        const statusBadge = document.getElementById('statusBadge');
        const playlistContainer = document.getElementById('playlist');
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('searchInput');

        let currentCategory = 'tv';
        let activeMediaId = null;

        // Soatni yangilash
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('uz-UZ', {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Safe Video Playback (Promise Handling)
        async function playMedia(item) {
            try {
                statusBadge.innerText = "YUKLANMOQDA...";
                statusBadge.style.color = "var(--accent)";
                
                player.pause();
                videoSource.src = item.url;
                player.load();

                currentTitle.innerText = "▶ " + item.title;
                activeMediaId = item.id;
                
                // Ro'yxatdagi aktiv element stilini yangilash
                renderPlaylist(getCategoryItems(currentCategory));

                await player.play();
                statusBadge.innerText = "IJRO ETILMOQDA";
                statusBadge.style.color = "#4ade80"; // green
            } catch (err) {
                console.warn("Autoplay / Network Error:", err);
                statusBadge.innerText = "TAYYOR (BOSING)";
                statusBadge.style.color = "var(--text-muted)";
            }
        }

        // Kategoriya bo'yicha elementlarni olish
        function getCategoryItems(cat) {
            return mediaDatabase[cat] || [];
        }

        // Pleylistni chiqarish
        function renderPlaylist(items) {
            playlistContainer.innerHTML = '';

            if (items.length === 0) {
                playlistContainer.innerHTML = `<div class="empty-msg">Hech narsa topilmadi 😕</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                const isPlaying = item.id === activeMediaId;
                card.className = `item-card ${isPlaying ? 'playing' : ''}`;
                
                card.onclick = () => playMedia(item);

                card.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-meta">${item.type}</div>
                    </div>
                    <div class="play-icon">${isPlaying ? '⏸' : '▶'}</div>
                `;
                playlistContainer.appendChild(card);
            });
        }

        // Kategoriyani almashtirish funksiyasi
        function switchCategory(catKey) {
            currentCategory = catKey;

            // Kategoriya tugmalarining aktivligini yangilash
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-cat') === catKey);
            });

            // Pastki navigatsiya aktivligini yangilash
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-nav') === catKey);
            });

            // Qidiruvni yopish
            if (searchBox.classList.contains('active')) {
                toggleSearch(false);
            }

            document.getElementById('listTitle').innerText = `Mavjud ${catKey.toUpperCase()}lar`;
            renderPlaylist(getCategoryItems(catKey));
        }

        // Qidiruv funksionalligi
        function toggleSearch(forceState) {
            const show = forceState !== undefined ? forceState : !searchBox.classList.contains('active');
            
            if (show) {
                searchBox.classList.add('active');
                document.getElementById('searchNavBtn').classList.add('active');
                searchInput.focus();
            } else {
                searchBox.classList.remove('active');
                document.getElementById('searchNavBtn').classList.remove('active');
                searchInput.value = '';
                renderPlaylist(getCategoryItems(currentCategory));
            }
        }

        function filterMedia(query) {
            const cleanQuery = query.toLowerCase().trim();
            if (!cleanQuery) {
                renderPlaylist(getCategoryItems(currentCategory));
                return;
            }

            // Barcha kategoriyalar bo'ylab qidirish
            const allItems = Object.values(mediaDatabase).flat();
            const filtered = allItems.filter(item => item.title.toLowerCase().includes(cleanQuery));
            
            document.getElementById('listTitle').innerText = `Qidiruv natijalari (${filtered.length})`;
            renderPlaylist(filtered);
        }

        function showSettings() {
            alert("⚙️ IKROMJON TV v2.0\nBarcha modullar barqaror ishlayapti.");
        }

        // Kategoriya tugmalariga Event Listeners biriktirish
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const cat = this.getAttribute('data-cat');
                switchCategory(cat);
            });
        });

        // Boshlang'ich yuklanish
        switchCategory('tv');
        // Birinchi elementni pleyerga yuklab qo'yish (ijro etmasdan)
        if (mediaDatabase.tv.length > 0) {
            const first = mediaDatabase.tv[0];
            videoSource.src = first.url;
            currentTitle.innerText = first.title;
            activeMediaId = first.id;
            renderPlaylist(mediaDatabase.tv);
        }
    </script>
</body>
</html>
