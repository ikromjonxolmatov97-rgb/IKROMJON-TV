<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKROMJON AI - Global Super Platforma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Futuristik AI Orqa Fon */
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            background-attachment: fixed;
            color: #e5e7eb;
        }

        .glass {
            background: rgba(17, 24, 39, 0.7) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 4s linear infinite; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- YUKLANISH EKRANI -->
    <div id="preloader" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center space-y-6">
        <div class="relative">
            <div class="w-28 h-28 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin-slow"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fa-solid fa-robot text-4xl text-blue-400"></i>
            </div>
        </div>
        <h1 class="text-2xl font-bold text-blue-400">IKROMJON AI</h1>
        <div class="w-64 bg-gray-900 rounded-full h-2 overflow-hidden">
            <div id="progress-bar" class="bg-blue-600 h-2 transition-all duration-150" style="width: 0%"></div>
        </div>
        <div id="progress-text" class="text-sm font-bold text-blue-400">0%</div>
    </div>

    <!-- FON MUSIQASI -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3" type="audio/mpeg">
    </audio>

    <div class="flex-1 flex overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 glass flex flex-col z-20">
            <div class="p-5 font-bold text-blue-400 text-xl border-b border-gray-800">IKROMJON AI</div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <button onclick="alert('AI Bo\'limi')" class="w-full text-left p-3 rounded-xl hover:bg-blue-600 transition flex items-center gap-3">
                    <i class="fa-solid fa-robot"></i> AI Chat
                </button>
                <button onclick="alert('Dasturlash')" class="w-full text-left p-3 rounded-xl hover:bg-blue-600 transition flex items-center gap-3">
                    <i class="fa-solid fa-code"></i> Dasturlash
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8 overflow-y-auto">
            <div class="glass p-8 rounded-3xl">
                <h2 class="text-3xl font-bold mb-4">Xush kelibsiz, Ikromjon!</h2>
                <p class="text-gray-400">Ushbu tizim sizning shaxsiy AI yordamchingiz.</p>
                <button onclick="document.getElementById('bg-music').play()" class="mt-6 bg-blue-600 px-6 py-2 rounded-xl font-bold hover:bg-blue-500">
                    Musiqani boshlash
                </button>
            </div>
        </main>
    </div>

    <script>
        let progress = 0;
        const bar = document.getElementById('progress-bar');
        const txt = document.getElementById('progress-text');
        
        const interval = setInterval(() => {
            progress += 2;
            bar.style.width = progress + '%';
            txt.innerText = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                document.getElementById('preloader').style.display = 'none';
            }
        }, 50);
    </script>
</body>
</html>
